<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Поселение</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #eef3e8;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .app {
            width: min(420px, 100%);
            padding: 28px;
            border-radius: 20px;
            background: white;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 10px;
        }

        .status {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            background: #f1f5ef;
        }

        .row {
            margin-top: 12px;
        }

        .label {
            font-size: 13px;
            color: #6b7168;
        }

        .value {
            margin-top: 4px;
            font-weight: 700;
            word-break: break-word;
        }

        .error {
            color: #a33;
        }

        .loading {
            color: #667;
        }
    </style>
</head>

<body>

<div class="app">

    <h1>Поселение</h1>

    <p id="status" class="loading">
        Подключение...
    </p>

    <div class="status">

        <div class="row">
            <div class="label">Игрок</div>
            <div class="value" id="user">
                Проверка...
            </div>
        </div>

        <div class="row">
            <div class="label">Поселение</div>
            <div class="value" id="city">
                Проверка...
            </div>
        </div>

        <div class="row">
            <div class="label">ID города</div>
            <div class="value" id="cityId">
                Проверка...
            </div>
        </div>

    </div>

</div>

<script>

    const tg = window.Telegram.WebApp;

    const API_URL =
        "https://poselenie-api.egobeznik.workers.dev";

    const statusElement =
        document.getElementById("status");

    const userElement =
        document.getElementById("user");

    const cityElement =
        document.getElementById("city");

    const cityIdElement =
        document.getElementById("cityId");


    tg.ready();
    tg.expand();


    async function authenticate() {

        if (!tg.initData) {

            statusElement.textContent =
                "Mini App открыт не из Telegram";

            statusElement.className =
                "error";

            userElement.textContent =
                "Нет Telegram initData";

            cityElement.textContent =
                "—";

            cityIdElement.textContent =
                "—";

            return;
        }


        statusElement.textContent =
            "Авторизация...";


        try {

            const response = await fetch(
                `${API_URL}/auth`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        initData: tg.initData
                    })
                }
            );


            const data =
                await response.json();


            if (!response.ok || !data.success) {

                throw new Error(
                    data.error ||
                    "Ошибка авторизации"
                );
            }


            const player =
                data.player;

            const city =
                data.city;


            const playerName = [
                player.first_name,
                player.last_name
            ]
                .filter(Boolean)
                .join(" ");


            userElement.textContent =
                `${playerName} (@${
                    player.username || "без username"
                })`;


            cityElement.textContent =
                city.name;


            cityIdElement.textContent =
                city.id;


            statusElement.textContent =
                "Авторизация успешна";


        } catch (error) {

            console.error(error);

            statusElement.textContent =
                "Ошибка авторизации";

            statusElement.className =
                "error";

            userElement.textContent =
                error.message;

            cityElement.textContent =
                "—";

            cityIdElement.textContent =
                "—";
        }
    }


    authenticate();

</script>

</body>
</html>
